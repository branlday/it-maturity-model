<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IT Maturity Assessment</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="A facilitated IT maturity assessment from 5iveDays Strategy that rates 22 IT domains from governance to data, and compares IT leadership's view with what staff and the business experience.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500..900&family=Red+Hat+Text:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">5iveDays Strategy</div>
      <h1>IT Maturity Assessment</h1>
      <div class="org" id="orgline"></div>
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="Interview mode">
        <button id="mode-light" data-act="mode" data-v="light">Light</button>
        <button id="mode-full" data-act="mode" data-v="full">Full</button>
      </div>
      <button class="btn" id="session-btn" data-act="session">Session</button>
    </div>
  </header>
  <div class="levelstrip" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="shell">
    <nav class="rail" id="rail" aria-label="Assessment steps"></nav>
    <main id="main"></main>
  </div>
</div>
<div id="sheet"></div>
<script src="assets/config.js"></script>
<script src="assets/icons.js"></script>
<script src="assets/framework.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
